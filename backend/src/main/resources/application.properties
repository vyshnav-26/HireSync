spring.application.name=hiresync

# PostgreSQL Configuration (Primary)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hiresync?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=#RootPass123
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# MySQL Configuration (Fallback)
app.datasource.mysql.url=jdbc:mysql://127.0.0.1:3306/hiresync?createDatabaseIfNotExist=true&useSSL=false
app.datasource.mysql.username=root
app.datasource.mysql.password=#RootPass123

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=dummy_brevo_user
spring.mail.password=dummy_brevo_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uUGVycG9zZXM=
jwt.expiration=86400000

# Cloudflare R2 Configuration
cloudflare.r2.bucket=hiresync-bucket
cloudflare.r2.endpoint=https://example.r2.cloudflarestorage.com
cloudflare.r2.access-key=dummy_access_key
cloudflare.r2.secret-key=dummy_secret_key
cloudflare.r2.region=auto

