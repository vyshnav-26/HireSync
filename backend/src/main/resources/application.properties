spring.application.name=hiresync

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hiresync
spring.datasource.username=postgres
spring.datasource.password=#RootPass123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=dummy_brevo_user
spring.mail.password=dummy_brevo_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

