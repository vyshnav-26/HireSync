spring.application.name=hiresync
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

app.seed-data=true

# Brevo SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:dummy_brevo_user}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy_brevo_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uUGVycG9zZXM=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudflare R2 / S3 Configuration
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET:hiresync-bucket}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:dummy_access_key}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:dummy_secret_key}
cloudflare.r2.region=${CLOUDFLARE_R2_REGION:auto}

# Gemini AI Configuration (Google Gemini 2.0 Flash)
gemini.api-key=${GEMINI_API_KEY:dummy_gemini_api_key}
gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
